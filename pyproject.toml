[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "borsai"
version = "0.0.0"
description = "Borsa Istanbul halka arz tahmin modelleri: fit, backtest, sicil, skorlama"
requires-python = ">=3.12,<3.13"
# Referans ortam: ~/.borsai-venvs/v1_5-model-macos (CPython 3.12.14, macOS arm64).
# Sürümler birebir sabittir; V1.5 çekirdeği runtime sürümünü kendisi de denetler.
dependencies = [
    "numpy==2.5.2",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
    "joblib==1.5.3",
    "threadpoolctl==3.6.0",
    # scikit-learn 1.9.0'ın zorunlu bağımlılığı; referans ortamda da bu sürüm.
    "narwhals==2.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
]

[tool.setuptools]
packages = ["borsai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
